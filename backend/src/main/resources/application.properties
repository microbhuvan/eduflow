spring.application.name=eduflow-backend
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/eduflow
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway runs before Hibernate so existing DBs get new columns/tables even when ddl-auto=update skips them.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

app.jwt.secret=ZWR1Zmxvd19zZWNyZXRfa2V5X2Zvcl9kZW1vX2NoYW5nZV9tZV8xMjM0NTY3ODkw
app.jwt.expiration-ms=86400000

# When true, seeds sample courses (modules + announcements) if the courses table is empty.
app.demo-seed=true
